# act 로컬 환경용 android/gradle.properties 오버라이드 (ACT=1 일 때 적용)
# Gradle daemon heap / Metaspace — lintVitalAnalyzeRelease가 class metadata를 많이 올려
# 512m Metaspace를 초과하므로 1024m으로 늘림
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Kotlin compiler daemon 별도 JVM 메모리 제한 (기본값 최대 4GB → 2GB로 제한)
kotlin.daemon.jvm.options=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.caching=true

# Docker 컨테이너에서 native inotify polling(error=4)으로 daemon이 죽는 것을 방지
org.gradle.vfs.watch=false

# Metro 번들러와 Kotlin 병렬 컴파일 동시 실행으로 인한 OOM 방지
org.gradle.parallel=false

# act 로컬 테스트는 arm64-v8a 하나만 빌드 (4개 아키텍처 동시 NDK 컴파일 방지)
reactNativeArchitectures=arm64-v8a

# act 로컬 테스트에서 lint 스킵 (빌드 검증이 목적; lint는 CI에서 수행)
android.lint.checkReleaseBuilds=false

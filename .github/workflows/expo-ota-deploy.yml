name: Expo OTA Deploy

on:
  push:
    tags:
      - "deploy-ota"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-ota:
    runs-on: ubuntu-latest
    environment: production
    env:
      CI: true
      EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
      EXPO_PUBLIC_DOMAIN: ${{ vars.EXPO_PUBLIC_DOMAIN }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_ANDROID_EMULATOR_DOMAIN: ${{ vars.EXPO_PUBLIC_ANDROID_EMULATOR_DOMAIN }}
      EXPO_PUBLIC_DEBUG_INBOX: ${{ vars.EXPO_PUBLIC_DEBUG_INBOX }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Extract app version
        id: app_version
        run: |
          VERSION=$(grep -m1 "version:" app.config.js | sed "s/.*version: '//;s/',.*//")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "App version: $VERSION"

      - name: Publish OTA update
        run: npx eas-cli update --branch production --message "OTA ${{ steps.app_version.outputs.version }} (deploy-ota)" --non-interactive

      - name: Create ota version tag
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          TAG="ota-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" -m "OTA update $VERSION"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

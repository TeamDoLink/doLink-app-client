name: Android Play Store Deploy (Fastlane)

on:
  push:
    tags:
      - "release-*"
  workflow_dispatch:

jobs:
  deploy-android:
    runs-on: ubuntu-latest
    environment: production
    env:
      CI: true
      GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
      RELEASE_TAG: ${{ github.ref_name }}
      EXPO_PUBLIC_DOMAIN: ${{ vars.EXPO_PUBLIC_DOMAIN }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_ANDROID_EMULATOR_DOMAIN: ${{ vars.EXPO_PUBLIC_ANDROID_EMULATOR_DOMAIN }}
      EXPO_PUBLIC_DEBUG_INBOX: ${{ vars.EXPO_PUBLIC_DEBUG_INBOX }}
      PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64 }}
      PLAY_STORE_TRACK: ${{ vars.PLAY_STORE_TRACK }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ACT: ${{ vars.ACT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: is ACT
        if: ${{ vars.ACT == '1' }}
        run: echo "ACT is 1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Setup Java (Gradle cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        if: ${{ vars.ACT == '1' }}
        with:
          log-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        if: ${{ vars.ACT == '1' }}
        run: yes | sdkmanager --licenses

      - name: Install JS dependencies
        run: npm ci

      - name: Restore base64 files
        run: bash ci/generate-files.sh

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --non-interactive

      - name: Check google-services.json after prebuild
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "google-services.json was not generated at android/app/google-services.json after expo prebuild"
            exit 1
          fi
          jq empty android/app/google-services.json

      - name: Restore Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Apply CI Gradle properties
        run: node ci/update-gradle-properties.js

      - name: Build Android
        run: bundle exec fastlane android build

      - name: Deploy to Play Store
        if: ${{ vars.ACT != '1' }}
        run: bundle exec fastlane android playstore

name: Android Play Store Deploy (Fastlane)

on:
  push:
    tags:
      - "release-*"
  workflow_dispatch:

jobs:
  deploy-android:
    runs-on: ubuntu-latest
    environment: production
    env:
      CI: true
      GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
      RELEASE_TAG: ${{ github.ref_name }}
      EXPO_PUBLIC_DOMAIN: ${{ vars.EXPO_PUBLIC_DOMAIN }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_ANDROID_EMULATOR_DOMAIN: ${{ vars.EXPO_PUBLIC_ANDROID_EMULATOR_DOMAIN }}
      EXPO_PUBLIC_DEBUG_INBOX: ${{ vars.EXPO_PUBLIC_DEBUG_INBOX }}
      PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64 }}
      PLAY_STORE_TRACK: ${{ vars.PLAY_STORE_TRACK }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Setup Java (Gradle cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS dependencies
        run: npm ci

      - name: Restore Android keystore
        run: |
          mkdir -p fastlane/credentials
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > fastlane/credentials/dolink.keystore

      - name: Restore Play service account json
        run: |
          mkdir -p fastlane/credentials
          printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > fastlane/credentials/playstore.json
          jq empty fastlane/credentials/playstore.json

      - name: Restore google-services.json
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          jq empty google-services.json

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --non-interactive

      - name: Check google-services.json after prebuild
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "google-services.json was not generated at android/app/google-services.json after expo prebuild"
            exit 1
          fi
          jq empty android/app/google-services.json

      - name: Restore Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Tune Gradle JVM memory for CI
        run: |
          if [ -f android/gradle.properties ] && rg -q '^org\.gradle\.jvmargs=' android/gradle.properties; then
            sed -i.bak 's#^org\.gradle\.jvmargs=.*#org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8#' android/gradle.properties
          else
            printf '\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8\n' >> android/gradle.properties
          fi

          if ! rg -q '^org\.gradle\.caching=true$' android/gradle.properties; then
            printf '\norg.gradle.caching=true\n' >> android/gradle.properties
          fi

      - name: Build and deploy Android
        run: bundle exec fastlane android build_and_deploy
